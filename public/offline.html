<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#247b6d" />
    <title>個案索引｜離線</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f6f8;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif}.card{width:min(100%,420px);padding:32px 25px;border:1px solid #d9e6df;border-radius:25px;background:linear-gradient(145deg,#fffdf7,#eaf6f0 58%,#f1edf8);text-align:center;box-shadow:0 14px 35px rgba(47,82,70,.09)}.mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 18px;border-radius:18px;background:#247b6d;color:white;font-size:29px;font-weight:850}h1{margin:0 0 8px;font-size:22px}p{margin:0;color:#5e716a;line-height:1.65}button{min-height:46px;margin-top:22px;padding:0 20px;border:0;border-radius:14px;background:#77689c;color:#fff;font-weight:750}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">LPY</div>
      <h1>暫時沒有網絡</h1>
      <p>首次安裝尚未完成。恢復網絡後開啟程式一次，日後便可離線使用。</p>
      <button type="button" onclick="location.reload()">重新嘗試</button>
    </main>
  </body>
</html>
