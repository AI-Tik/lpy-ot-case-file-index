name: Bootstrap privacy-safe app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore application source
        run: |
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          base64 --decode bootstrap.b64 > /tmp/lpy-app.tar.gz
          rm -f bootstrap.b64
          tar -xzf /tmp/lpy-app.tar.gz
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish privacy-safe application source"
          git push
